[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "metacog"
version = "0.0.1"
description = "An agent SDK shaped like the OpenAI Agents SDK whose agents learn to think less, built on the helix harness."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Micheal Lanham" }]
# helix's core needs; helix itself comes from the book repository this project
# sits in, which is not a package (see README, "Development setup").
dependencies = [
  "litellm>=1.50.0",
  # litellm 1.106+ imports its MCP handler on the chat-completions path, so a
  # live call fails without this package even when no MCP tool is used.
  "mcp>=1.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
]

[project.scripts]
metacog = "metacog.cli:main"

[project.optional-dependencies]
# `metacog serve`: the HTTP service and live dashboard (the versions the repository's Observatory uses).
serve = ["fastapi>=0.128.0", "uvicorn>=0.30.0"]
# Claude models go through Anthropic's SDK (helix.metacognition.claude), imported only when one is called.
claude = ["anthropic>=2.6"]
dev = ["metacog[serve]", "pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/metacog"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
# Chapter 7's seeds and the mechanisms a search designed are kept exactly as written: the code they hold is
# data a search reads and rewrites, and a lint fix would change it.
# Mechanism sources follow the lab's guard (no `_` names), and model-written procedures are kept verbatim.
extend-exclude = ["examples/decisions/learned",
                  "examples/learning/designed",
                  "examples/*/memories/learned_by_*.py", "examples/invoices/memories/amount_payable_designed_mini.py"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
# These lines are prompts and request wordings that recordings are keyed on; rewrapping them changes the keys.
"examples/decisions/*.py" = ["E501"]
